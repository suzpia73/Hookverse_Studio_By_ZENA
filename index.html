<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hookverse Studio — 100vh 시네마틱 관제탑</title>
  <meta name="description" content="KAIRA AI 1인 기업 Hookverse Studio 실시간 100vh 무스크롤 시네마틱 총괄 관제탑">
  <link rel="icon" type="image/png" href="control_room/favicon.png">
  <meta http-equiv="refresh" content="0; url=control_room/">
  <script>
    window.location.replace("control_room/");
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #040507;
      color: #eed37f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(238, 211, 127, 0.2);
      border-top-color: #eed37f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #eed37f, #f43f5e, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      margin-top: 6px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">HOOKVERSE STUDIO</div>
  <div class="sub">시네마틱 관제탑으로 안전하게 연결 중입니다...</div>
</body>
</html>
