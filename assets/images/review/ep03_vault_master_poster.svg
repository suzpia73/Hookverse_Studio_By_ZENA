<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="45%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Neon Rim Lights -->
    <radialGradient id="neonPurpleGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.28)" />
      <stop offset="60%" stop-color="rgba(168, 85, 247, 0.08)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <radialGradient id="goldRimGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(238, 211, 127, 0.25)" />
      <stop offset="70%" stop-color="transparent" />
    </radialGradient>

    <!-- Metallic Vault Shading -->
    <linearGradient id="vaultMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a445d" />
      <stop offset="25%" stop-color="#1e2436" />
      <stop offset="50%" stop-color="#2a334a" />
      <stop offset="75%" stop-color="#141926" />
      <stop offset="100%" stop-color="#2d374f" />
    </linearGradient>

    <linearGradient id="goldDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed37f" />
      <stop offset="50%" stop-color="#997a2b" />
      <stop offset="100%" stop-color="#eed37f" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1080" height="1920" fill="url(#bgGlow)" />
  <circle cx="540" cy="800" r="600" fill="url(#neonPurpleGlow)" />
  <circle cx="540" cy="800" r="500" fill="url(#goldRimGlow)" />

  <!-- Background Architecture Lines (Subterranean Vault Hallway) -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="2">
    <line x1="0" y1="0" x2="380" y2="600" />
    <line x1="1080" y1="0" x2="700" y2="600" />
    <line x1="0" y1="1920" x2="380" y2="1200" />
    <line x1="1080" y1="1920" x2="700" y2="1200" />
    <line x1="100" y1="0" x2="100" y2="1920" stroke-dasharray="10 20" opacity="0.4" />
    <line x1="980" y1="0" x2="980" y2="1920" stroke-dasharray="10 20" opacity="0.4" />
  </g>

  <!-- Massive Outer Vault Gear Ring -->
  <circle cx="540" cy="800" r="380" fill="none" stroke="rgba(238, 211, 127, 0.15)" stroke-width="4" stroke-dasharray="24 16" />
  <circle cx="540" cy="800" r="350" fill="url(#vaultMetal)" stroke="rgba(238, 211, 127, 0.5)" stroke-width="6" />

  <!-- 12 Heavy Locking Bolts around Vault Perimeter -->
  <g transform="translate(540, 800)">
    <circle cx="0" cy="-350" r="24" fill="#eed37f" stroke="#10141f" stroke-width="6" />
    <circle cx="175" cy="-303" r="20" fill="#c084fc" opacity="0.8" />
    <circle cx="303" cy="-175" r="24" fill="#eed37f" stroke="#10141f" stroke-width="6" />
    <circle cx="350" cy="0" r="20" fill="#22d3ee" opacity="0.8" />
    <circle cx="303" cy="175" r="24" fill="#eed37f" stroke="#10141f" stroke-width="6" />
    <circle cx="175" cy="303" r="20" fill="#c084fc" opacity="0.8" />
    <circle cx="0" cy="350" r="24" fill="#eed37f" stroke="#10141f" stroke-width="6" />
    <circle cx="-175" cy="303" r="20" fill="#22d3ee" opacity="0.8" />
    <circle cx="-303" cy="175" r="24" fill="#eed37f" stroke="#10141f" stroke-width="6" />
    <circle cx="-350" cy="0" r="20" fill="#eed37f" stroke="#10141f" stroke-width="6" />
    <circle cx="-303" cy="-175" r="20" fill="#c084fc" opacity="0.8" />
    <circle cx="-175" cy="-303" r="24" fill="#eed37f" stroke="#10141f" stroke-width="6" />
  </g>

  <!-- Inner Vault Door Frame -->
  <circle cx="540" cy="800" r="270" fill="#0c101c" stroke="#22d3ee" stroke-width="3" opacity="0.9" />
  <circle cx="540" cy="800" r="220" fill="url(#vaultMetal)" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Central Heavy Wheel Spokes -->
  <g transform="translate(540, 800)" stroke="url(#goldDial)" stroke-width="12" stroke-linecap="round">
    <line x1="0" y1="-180" x2="0" y2="180" />
    <line x1="-180" y1="0" x2="180" y2="0" />
    <line x1="-127" y1="-127" x2="127" y2="127" />
    <line x1="-127" y1="127" x2="127" y2="-127" />
  </g>

  <!-- Central Safe Dial Lock -->
  <circle cx="540" cy="800" r="90" fill="#080b12" stroke="#eed37f" stroke-width="6" filter="url(#softGlow)" />
  <circle cx="540" cy="800" r="65" fill="url(#vaultMetal)" />
  <circle cx="540" cy="800" r="24" fill="#eed37f" />

  <!-- Dial Numbers Scale -->
  <circle cx="540" cy="800" r="80" fill="none" stroke="rgba(238, 211, 127, 0.6)" stroke-width="2" stroke-dasharray="4 8" />

  <!-- Atmospheric Steam / Moisture Particles -->
  <ellipse cx="540" cy="1150" rx="360" ry="60" fill="rgba(34, 211, 238, 0.08)" filter="url(#neonBlur)" />

  <!-- Silhouetted Muse (NEURA) Wet Trenchcoat Figure before Vault -->
  <g transform="translate(540, 990)">
    <!-- Wet Floor Reflection -->
    <ellipse cx="0" cy="240" rx="140" ry="16" fill="rgba(238, 211, 127, 0.12)" filter="url(#softGlow)" />
    <!-- Back Silhouette with Rim Light -->
    <path d="M-40,60 C-60,110 -85,180 -95,240 L95,240 C85,180 60,110 40,60 C32,45 28,25 24,0 L-24,0 C-28,25 -32,45 -40,60 Z" fill="#06080e" stroke="rgba(238, 211, 127, 0.4)" stroke-width="2.5" />
    <!-- Head & Wet Strands Silhouette -->
    <circle cx="0" cy="-35" r="24" fill="#06080e" stroke="rgba(192, 132, 252, 0.6)" stroke-width="2" />
    <!-- Wet Hair Droplets Glow -->
    <circle cx="12" cy="-22" r="2" fill="#eed37f" />
    <circle cx="-14" cy="-18" r="2" fill="#22d3ee" />
  </g>

  <!-- TOP HEADER BRANDING -->
  <g transform="translate(540, 160)" text-anchor="middle">
    <!-- Channel Badge -->
    <rect x="-190" y="-35" width="380" height="48" rx="24" fill="rgba(12, 16, 26, 0.85)" stroke="rgba(238, 211, 127, 0.4)" stroke-width="1.5" />
    <text x="0" y="-3" fill="#eed37f" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" letter-spacing="4">HOOKVERSE STUDIO</text>
  </g>

  <!-- EPISODE IDENTIFIER -->
  <g transform="translate(540, 260)" text-anchor="middle">
    <text x="0" y="0" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700" letter-spacing="6">IMF 3부작 완결편 · EPISODE 03</text>
    <text x="0" y="60" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">지하 비밀 외환 금고 잠입</text>
  </g>

  <!-- 1997 TIMESTAMP & WHAT-IF BANNER -->
  <g transform="translate(540, 390)" text-anchor="middle">
    <rect x="-240" y="-22" width="480" height="44" rx="8" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1.5" />
    <text x="0" y="6" fill="#fecdd3" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" letter-spacing="2">1997.11.21 00:00:00 · 중앙 금융 본점 지하</text>
  </g>

  <!-- BOTTOM STATUS & OPAL BADGE -->
  <g transform="translate(540, 1540)" text-anchor="middle">
    <!-- Glowing Pre-production Frame -->
    <rect x="-340" y="-55" width="680" height="110" rx="16" fill="rgba(10, 14, 22, 0.9)" stroke="rgba(192, 132, 252, 0.6)" stroke-width="2" filter="url(#softGlow)" />
    
    <text x="0" y="-12" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" letter-spacing="2">⚙️ Google Opal 6대 노드 설계 착수</text>
    <text x="0" y="28" fill="#eed37f" font-family="'Inter', sans-serif" font-size="19" font-weight="600" letter-spacing="0.5">3미터 티타늄 철문 앞 대치 · 30초 4컷 마스터 실사 렌더링 대기</text>
  </g>

  <!-- CINEMATIC CAMERA METADATA -->
  <g transform="translate(540, 1720)" text-anchor="middle">
    <text x="0" y="0" fill="rgba(255,255,255,0.45)" font-family="'JetBrains Mono', monospace" font-size="17" letter-spacing="3">PANAVISION 35mm · G3 FACE ANCHOR LOCK · NEO-NOIR</text>
  </g>
</svg>
